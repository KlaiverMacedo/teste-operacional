<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Sistema de Vouchers</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="login-page">
    <div class="login-container">
      <header class="header-section">
        <h1 class="mb-3">Sistema de Vouchers</h1>
        <p class="mb-0">Acesso Restrito</p>
      </header>

      <main class="login-card">
        <h4 class="text-center mb-4">Login</h4>

        <div id="form-login">
          <p class="text-center text-muted mb-4">
            Acesso exclusivo para colaboradores e parceiros autorizados.
          </p>

          <a href="/.auth/login/aad?post_login_redirect_uri=/index.html" class="btn btn-primary mb-3 w-100 py-3" id="btn-microsoft">
            <i class="bi bi-microsoft me-2"></i>Entrar com a Conta Corporativa
          </a>

          <div id="login-feedback" class="mt-3 text-center"></div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
